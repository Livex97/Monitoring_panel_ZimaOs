name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Tag version to build and push'
        required: true
        default: 'v$(date +%Y.%m.%d)'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/zimaos-monitor-api

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./zimaos-monitor-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/zimaos-monitor-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/zimaos-monitor-api:latest
            ghcr.io/${{ github.repository }}/zimaos-monitor-api:${{ inputs.tag_version || github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release notes
        run: |
          echo "## Docker Image Built" > release-notes.txt
          echo "- Image: ${{ steps.push.outputs.imageid }}" >> release-notes.txt
          echo "- Tags: ghcr.io/${{ github.repository }}/zimaos-monitor-api:${{ github.ref_name }}" >> release-notes.txt
          echo "- Platform: Multi-architecture (amd64, arm64)" >> release-notes.txt
          echo "- Built on: $(date)" >> release-notes.txt

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.txt
          retention-days: 1