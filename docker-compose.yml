version: '3.8'

services:
  zimaos-monitor-api:
    build:
      context: ./zimaos-monitor-api
      dockerfile: Dockerfile
    image: ghcr.io/livex97/monitoring_panel_zimaos/zimaos-monitor-api:latest
    container_name: zimaos-monitor-api
    restart: unless-stopped
    ports:
      - "${MONITOR_PORT:-8787}:8787"
    environment:
      - MONITOR_PORT=8787
      - MONITOR_API_KEY=${MONITOR_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

x-casaos:
  hostname: ""
  index: /
  is_uncontrolled: false
  main: zimaos-monitor-api
  port_map: "8787"
  scheme: http
  title:
    custom: MonitorPanel
